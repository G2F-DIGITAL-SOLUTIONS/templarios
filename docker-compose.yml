services:
  app:
    image: kooldev/node:22
    # --ignore-lock: .astro/dev.json lives on the bind-mounted host dir and
    # outlives containers. A fresh container reuses low PIDs, so Astro mistakes
    # that stale lock for a live server and exits ("Another astro dev server
    # is already running"). The container itself is the isolation boundary,
    # so the lock is meaningless here. Do NOT use --force: it would SIGTERM
    # whatever unrelated in-container process now owns the stale PID.
    command: ["npm", "run", "dev", "--", "--ignore-lock"]
    ports:
      # Host port must NOT be 6000: browsers refuse it with ERR_UNSAFE_PORT
      # (6000 = X11, on Chromium/Firefox's blocked-port list), even though
      # the server itself is fine. 4321 is Astro's conventional port.
      # The container-internal port stays 6000 (PORT below).
      - "${KOOL_APP_PORT:-4321}:6000"
    environment:
      # Match the host UID (kool sets KOOL_ASUSER). Defaulting to 0 made
      # `app` write root-owned files into the bind mount; then `kr npm …`
      # (one-off container as uid 1000) hit EACCES on node_modules/.vite.
      ASUSER: "${KOOL_ASUSER:-${UID:-1000}}"
      UID: "${UID:-1000}"
      # Astro binds to 127.0.0.1 unless told otherwise, which Docker cannot publish.
      HOST: 0.0.0.0
      PORT: "6000"
      KOOL_APP_PORT: "${KOOL_APP_PORT:-4321}"
      # Keep the dev server in the foreground so it stays the container's main process.
      ASTRO_DEV_BACKGROUND: "0"
      ASTRO_PREVIEW_BACKGROUND: "0"
    volumes:
      - .:/app:delegated
    networks:
      - kool_local
      - kool_global

  prod:
    image: kooldev/node:22
    # Opt-in only: without a profile, `docker compose up` / `kool start`
    # starts every service, and app + prod publishing the same host port
    # makes one of them fail with "port is already allocated".
    # Run it explicitly: docker compose --profile prod up prod
    profiles: ["prod"]
    # Same stale-lock issue as app, via .astro/preview.json.
    command: ["npm", "run", "preview", "--", "--ignore-lock"]
    ports:
      # Distinct, browser-safe host port so prod can run alongside dev
      # (see the ERR_UNSAFE_PORT note on the app service).
      - "${KOOL_PREVIEW_PORT:-4322}:6000"
    environment:
      ASUSER: "${KOOL_ASUSER:-${UID:-1000}}"
      UID: "${UID:-1000}"
      HOST: 0.0.0.0
      PORT: "6000"
      KOOL_APP_PORT: "${KOOL_PREVIEW_PORT:-4322}"
      # Keep the preview server in the foreground so it stays the container's main process.
      ASTRO_PREVIEW_BACKGROUND: "0"
    volumes:
      - .:/app:delegated
    networks:
      - kool_local
      - kool_global

networks:
  kool_local:
  kool_global:
    external: true
    name: "${KOOL_GLOBAL_NETWORK:-kool_global}"
